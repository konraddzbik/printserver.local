name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x scripts/*.sh .claude/hooks/*.sh tests/*.sh
      - name: bash syntax
        run: for f in scripts/*.sh .claude/hooks/*.sh tests/*.sh; do bash -n "$f"; done
      - name: tests
        run: tests/run.sh
      - name: Definition of Done in sync
        run: ./scripts/check-dod-sync.sh
